# Banco de dados
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/saudefacil}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8000}
# Nome da aplicação
spring.application.name=saudefacil

# Chave usada para assinar o JWT (definir via variável de ambiente em produção)
jwt.secret=${JWT_SECRET:saudefacil-chave-secreta-super-segura-2024}

# Origens permitidas no CORS, separadas por vírgula (definir a URL da Vercel em produção)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}